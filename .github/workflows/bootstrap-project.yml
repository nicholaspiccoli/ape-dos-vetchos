name: Bootstrap enriched architecture site

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-project.yml'

permissions:
  contents: write

jobs:
  unpack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble project bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/ape_text_part_00 .bootstrap/ape_text_part_01 > /tmp/ape_text_project.tar.gz
          mkdir -p /tmp/ape-project
          tar -xzf /tmp/ape_text_project.tar.gz -C /tmp/ape-project

      - name: Replace project with enriched version
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.bootstrap' -exec rm -rf {} +
          cp -a /tmp/ape-project/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Validate static project
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f motion.js
          node --check motion.js
          grep -q 'Casa que Acolhe' index.html
          grep -q 'GALERIA · 11 PEÇAS VISUAIS' index.html
          ! grep -q 'assets/antes-' index.html

      - name: Commit enriched project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: enrich ageing-in-place architecture experience'
          git push origin HEAD:main
