name: Bootstrap site from packaged artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-site.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged site
        run: |
          set -euo pipefail
          mkdir -p /tmp/site
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://at.adobe.com/urJd8gujKXS0uSa6' \
            -o /tmp/site/site.zip
          unzip -q /tmp/site/site.zip -d /tmp/site/unpacked

      - name: Install packaged site at repository root
        run: |
          set -euo pipefail
          cp -R /tmp/site/unpacked/apartamento-avos-redesign/. .
          rm -f .github/workflows/bootstrap-site.yml

      - name: Commit project files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: publish accessible apartment redesign microsite'
          git push origin HEAD:main
